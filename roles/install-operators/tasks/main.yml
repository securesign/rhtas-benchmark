# Install RHBK, RHTAS, and Grafana operators
---

# ── RHBK Operator ────────────────────────────────────────────────────────────
- name: "Check if RHBK Operator is already installed"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "keycloak-system"
  register: rhbk_existing_csvs

- name: "Set RHBK already installed fact"
  ansible.builtin.set_fact:
    rhbk_already_installed: "{{ rhbk_existing_csvs.resources | selectattr('metadata.name', 'match', 'rhbk-operator\\.') | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0 }}"

- name: "RHBK Operator already installed, skipping"
  ansible.builtin.debug:
    msg: "RHBK Operator is already installed, skipping subscription creation."
  when: rhbk_already_installed

- name: "Install RHBK Operator"
  when: not rhbk_already_installed
  block:
    - name: Build Kustomize output for RHBK Operator
      ansible.builtin.command: "oc kustomize {{ path_to_k8s_configs }}/keycloak/operator/base/"
      register: kustomize_operator_output
      changed_when: false

    - name: Apply RHBK Operator resources
      kubernetes.core.k8s:
        state: present
        definition: "{{ kustomize_operator_output.stdout }}"

    - name: "Find pending RHBK install plans"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "keycloak-system"
      register: rhbk_install_plans

    - name: "Approve pending RHBK install plans"
      kubernetes.core.k8s:
        state: present
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        name: "{{ item.metadata.name }}"
        namespace: "keycloak-system"
        definition:
          spec:
            approved: true
      loop: "{{ rhbk_install_plans.resources | selectattr('spec.approved', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: rhbk_install_plans.resources | length > 0

    - name: "Wait for RHBK Operator to be ready"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "keycloak-system"
        label_selectors:
          - "operators.coreos.com/rhbk-operator.keycloak-system"
      register: keycloak_csv_status
      retries: 30
      delay: 10
      until: >
        keycloak_csv_status.resources | length > 0 and
        keycloak_csv_status.resources[0].status is defined and
        keycloak_csv_status.resources[0].status.phase == "Succeeded"

    - name: "Wait for Keycloak CRD to be established"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: keycloaks.k8s.keycloak.org
      register: keycloak_crd_status
      retries: 30
      delay: 10
      until: >
        keycloak_crd_status.resources | length > 0 and
        keycloak_crd_status.resources[0].status is defined and
        keycloak_crd_status.resources[0].status.conditions is defined and
        keycloak_crd_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0

# ── RHTAS Operator ───────────────────────────────────────────────────────────
- name: "Check if RHTAS Operator is already installed"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ operators.rhtas.namespace }}"
  register: rhtas_existing_csvs

- name: "Set RHTAS already installed fact"
  ansible.builtin.set_fact:
    rhtas_already_installed: "{{ rhtas_existing_csvs.resources | selectattr('metadata.name', 'match', 'rhtas-operator\\.') | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0 }}"

- name: "RHTAS Operator already installed, skipping subscription"
  ansible.builtin.debug:
    msg: "RHTAS Operator is already installed (possibly via operator-sdk run bundle), skipping subscription creation."
  when: rhtas_already_installed

- name: "Install RHTAS Operator via Subscription"
  when: not rhtas_already_installed
  block:
    - name: "Apply RHTAS Operator Subscription"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: "{{ operators.rhtas.name }}"
            namespace: "{{ operators.rhtas.namespace }}"
          spec:
            channel: "{{ operators.rhtas.channel }}"
            installPlanApproval: Automatic
            name: "{{ operators.rhtas.name }}"
            source: "{{ operators.rhtas.source }}"
            sourceNamespace: "{{ operators.rhtas.sourceNamespace }}"

    - name: "Find pending RHTAS install plans"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ operators.rhtas.namespace }}"
      register: rhtas_install_plans

    - name: "Approve pending RHTAS install plans"
      kubernetes.core.k8s:
        state: present
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        name: "{{ item.metadata.name }}"
        namespace: "{{ operators.rhtas.namespace }}"
        definition:
          spec:
            approved: true
      loop: "{{ rhtas_install_plans.resources | selectattr('spec.approved', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: rhtas_install_plans.resources | length > 0

    - name: "Wait for RHTAS Operator to be ready"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ operators.rhtas.namespace }}"
        label_selectors:
          - "operators.coreos.com/rhtas-operator.openshift-operators"
      register: rhtas_csv_status
      retries: 30
      delay: 10
      until: >
        rhtas_csv_status.resources | length > 0 and
        rhtas_csv_status.resources[0].status is defined and
        rhtas_csv_status.resources[0].status.phase == "Succeeded"

# ── Grafana Operator ─────────────────────────────────────────────────────────
- name: "Check if Grafana Operator is already installed"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ operators.grafana.namespace }}"
  register: grafana_existing_csvs

- name: "Set Grafana already installed fact"
  ansible.builtin.set_fact:
    grafana_already_installed: "{{ grafana_existing_csvs.resources | selectattr('metadata.name', 'match', 'grafana-operator\\.') | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0 }}"

- name: "Grafana Operator already installed, skipping subscription"
  ansible.builtin.debug:
    msg: "Grafana Operator is already installed, skipping subscription creation."
  when: grafana_already_installed

- name: "Install Grafana Operator via Subscription"
  when: not grafana_already_installed
  block:
    - name: "Patch Manual-approval subscriptions in target namespace to Automatic"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        namespace: "{{ operators.grafana.namespace }}"
      register: existing_subs_in_ns

    - name: "Switch Manual subscriptions to Automatic approval"
      kubernetes.core.k8s:
        state: present
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ item.metadata.name }}"
        namespace: "{{ operators.grafana.namespace }}"
        definition:
          spec:
            installPlanApproval: Automatic
      loop: "{{ existing_subs_in_ns.resources | selectattr('spec.installPlanApproval', 'defined') | selectattr('spec.installPlanApproval', 'equalto', 'Manual') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "Apply Grafana Operator Subscription"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: "{{ operators.grafana.name }}"
            namespace: "{{ operators.grafana.namespace }}"
          spec:
            channel: "{{ operators.grafana.channel }}"
            installPlanApproval: Automatic
            name: "{{ operators.grafana.name }}"
            source: "{{ operators.grafana.source }}"
            sourceNamespace: "{{ operators.grafana.sourceNamespace }}"

    - name: "Wait for Grafana Operator to be ready (approving install plans as needed)"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ operators.grafana.namespace }}"
        label_selectors:
          - "operators.coreos.com/grafana-operator.openshift-operators"
      register: grafana_csv_status
      retries: 30
      delay: 10
      until: >
        grafana_csv_status.resources | length > 0 and
        grafana_csv_status.resources[0].status is defined and
        grafana_csv_status.resources[0].status.phase == "Succeeded"

    - name: "Find and approve any remaining pending install plans"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ operators.grafana.namespace }}"
      register: remaining_install_plans

    - name: "Approve unapproved install plans"
      kubernetes.core.k8s:
        state: present
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        name: "{{ item.metadata.name }}"
        namespace: "{{ operators.grafana.namespace }}"
        definition:
          spec:
            approved: true
      loop: "{{ remaining_install_plans.resources | selectattr('spec.approved', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: remaining_install_plans.resources | length > 0

    - name: "Clean up stale Grafana CSVs"
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ item.metadata.name }}"
        namespace: "{{ operators.grafana.namespace }}"
      loop: "{{ grafana_csv_status.resources | rejectattr('status.phase', 'equalto', 'Succeeded') | list }}"
      loop_control:
        label: "{{ item.metadata.name }} ({{ item.status.phase | default('Unknown') }})"
      when: grafana_csv_status.resources | length > 1
